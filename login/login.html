<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login-title-page">Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-wrap">

    <section class="login-box">

      <!-- 로고 / 제목 -->
      <h1 class="logo" data-i18n="logo-alt">IKEA</h1>
      <p class="desc" data-i18n="login-desc-page">로그인 후 이용해주세요</p>

      <!-- 로그인 폼 -->
      <form class="login-form">

        <div class="input-box">
          <label for="id" data-i18n="login-id-label">이메일 또는 확인된 휴대폰 번호</label>
          <input type="text" id="id" placeholder="아이디 입력" data-i18n-placeholder="login-id-placeholder">
        </div>

        <div class="input-box">
          <label for="pw" data-i18n="login-pw-label">비밀번호</label>
          <input type="password" id="pw" placeholder="비밀번호 입력" data-i18n-placeholder="login-pw-placeholder">
        </div>

        <button type="submit" class="login-btn" data-i18n="login-btn-page">
          로그인
        </button>

      </form>

      <!-- 하단 링크 -->
      <div class="login-link">
        <a href="../signup.html" data-i18n="signup-link">회원가입</a>
        <a href="../forgot_password.html" data-i18n="forgot-pw-link">비밀번호 찾기</a>
      </div>

    </section>

  </main>

  <script src="../script.js"></script>
</body>
</html>
